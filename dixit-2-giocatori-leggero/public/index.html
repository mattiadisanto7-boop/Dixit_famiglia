<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#20192a" />
  <title>Immaginario — 2 giocatori</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <main class="app-shell">
    <header class="topbar">
      <button id="brand" class="brand" type="button" aria-label="Torna alla home">
        <span class="brand-mark">✦</span>
        <span>
          <strong>Immaginario</strong>
          <small>2 giocatori</small>
        </span>
      </button>
      <div id="roomBadge" class="room-badge hidden"></div>
    </header>

    <section id="screen" class="screen" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
